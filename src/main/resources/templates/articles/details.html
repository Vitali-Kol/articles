<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали статьи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Детали статьи</h2>

        <p><strong>ID:</strong> <span th:text="${article.id}"></span></p>
        <p><strong>Заголовок:</strong> <span th:text="${article.title}"></span></p>
        <p><strong>Описание:</strong> <span th:text="${article.description}"></span></p>
        <p><strong>Содержимое:</strong></p>
        <p th:text="${article.content}"></p>

        <p><strong>Автор:</strong> <span th:text="${article.author.username}"></span></p>

        <p><strong>Теги:</strong></p>
        <ul>
            <li th:each="tag : ${article.tags}" th:text="${tag.name}"></li>
        </ul>

        <!-- Добавляем отображение даты создания статьи -->
        <p><strong>Дата создания:</strong> <span th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></span></p>
        <p><strong>Дата создания:</strong> <span th:text="${#temporals.format(article.updatedAt , 'dd-MM-yyyy HH:mm')}"></span></p>

        <!-- Ссылка на возврат к списку статей -->
        <div class="d-flex justify-content-between mt-3">
            <a href="/articles" class="btn btn-outline-secondary">Назад к списку статей</a>
        </div>
    </div>
</div>
</body>
</html>
