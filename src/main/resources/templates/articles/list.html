<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список статей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Дополнительные стили для карточек */
        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
        }
        .card-text {
            font-size: 0.95rem;
        }
        .tag-badge {
            margin-right: 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Список статей</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${articles}">
        <div class="col" th:each="article : ${articles}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${article.title}"></h5>
                    <p class="card-text" th:text="${article.description}"></p>
                    <p class="card-text">
                        <small class="text-muted">Автор: <span th:text="${article.author.username}"></span></small>
                    </p>
                    <p class="card-text">
                        <small class="text-muted">
                            Создана: <span th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></span>
                        </small>
                    </p>
                    <p class="card-text">
                        <small class="text-muted">
                            Обновлена: <span th:text="${#temporals.format(article.updatedAt, 'dd-MM-yyyy HH:mm')}"></span>
                        </small>
                    </p>
                    <div>
                        <small>Теги:</small>
                        <span th:each="tag : ${article.tags}" class="badge bg-primary tag-badge" th:text="${tag.name}"></span>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <!-- Кнопка для перехода к деталям статьи (доступна всем) -->
                    <a th:href="@{/articles/{id}(id=${article.id})}" class="btn btn-info btn-sm">Детали</a>

                    <!-- Кнопки редактирования и удаления показываются, если:
                         - текущий пользователь является автором статьи
                         или
                         - имеет роль ADMIN (т.е. Его GrantedAuthority содержит ROLE_ADMIN)
                    -->
                    <span th:if="${(article.author != null and article.author.username == #authentication.principal.username)
                                  or (#authentication.principal.authorities.?[authority=='ADMIN_ROLE'].size() > 0)}">
                        <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-warning btn-sm">Редактировать</a>
                        <form th:action="@{/articles/delete/{id}(id=${article.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Вы уверены, что хотите удалить статью?')">
                                Удалить
                            </button>
                        </form>
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4">
        <a href="/articles/add" class="btn btn-success btn-lg">Добавить новую статью</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
