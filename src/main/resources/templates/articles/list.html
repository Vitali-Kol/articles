<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список статей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Можно добавить свои стили */
        .truncate {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Список статей</h2>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Заголовок</th>
                <th>Описание</th>
                <th>Slug</th>
                <th>Автор</th>
                <th>Создана</th>
                <th>Обновлена</th>
                <th>Теги</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="article : ${articles}">
                <td th:text="${article.id}"></td>
                <td th:text="${article.title}"></td>
                <td class="truncate" th:text="${article.description}"></td>
                <td th:text="${article.slug}"></td>
                <td th:text="${article.author.username}"></td>
                <td th:text="${#temporals.format(article.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(article.updatedAt, 'dd-MM-yyyy HH:mm')}"></td>
                <td>
                    <span th:each="tag : ${article.tags}" th:text="${tag.name + ' '}"></span>
                </td>
                <td>
                    <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-warning btn-sm">Редактировать</a>
                    <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Вы уверены, что хотите удалить статью?')">Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="text-center mt-3">
            <a th:href="@{/articles/new}" class="btn btn-success btn-lg">Добавить новую статью</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
