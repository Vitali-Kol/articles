<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Редактировать статью</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">Редактировать статью</h2>
    <form th:action="@{/articles/edit/{id}(id=${article.id})}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Заголовок</label>
            <input type="text" id="title" name="title" class="form-control" th:value="${article.title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea id="description" name="description" class="form-control" rows="3" required
                      th:text="${article.description}"></textarea>
        </div>
        <div class="mb-3">
            <label for="body" class="form-label">Содержимое</label>
            <textarea id="body" name="body" class="form-control" rows="6" required
                      th:text="${article.content}"></textarea>
        </div>
        <!-- Автор: устанавливается автоматически из аутентифицированного пользователя -->
        <div class="mb-3">
            <label class="form-label">Автор:</label>
            <p sec:authentication="name">Имя автора</p>
            <!-- Используем Thymeleaf-выражение для получения id -->
            <input type="hidden" name="authorId" th:value="${#authentication.principal.id}" />
        </div>
        <div class="mb-3">
            <label for="tagIds" class="form-label">Теги</label>
            <select id="tagIds" name="tagIds" class="form-select" multiple>
                <option th:each="tag : ${tags}" th:value="${tag.id}"
                        th:text="${tag.name}"
                        th:selected="${article.tags.contains(tag)}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a th:href="@{/articles}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
<!-- Подключаем JavaScript для Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
