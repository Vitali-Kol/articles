<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tags List</title>
</head>
<body>
<h1>Tags</h1>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Created At</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tag : ${tags}">
        <td th:text="${tag.id}"></td>
        <td th:text="${tag.name}"></td>
        <td th:text="${#dates.format(tag.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
    </tr>
    </tbody>
</table>
<br>
<a href="/">Home</a>
</body>
</html>
