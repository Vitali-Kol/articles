<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список пользователей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Дополнительные стили для красоты */
        .card {
            margin-bottom: 20px;
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Список пользователей</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="user : ${users}">
            <div class="card h-100 shadow-sm">
                <img th:src="${user.imageUrl}" class="card-img-top" alt="Фото профиля">
                <div class="card-body">
                    <h5 class="card-title" th:text="${user.username}">Имя пользователя</h5>
                    <p class="card-text" th:text="${user.email}">Email</p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-info btn-sm">Редактировать</a>
                    <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Вы уверены, что хотите удалить пользователя?')">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4">
        <a th:href="@{/users/new}" class="btn btn-success btn-lg">Добавить пользователя</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
