<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить пользователя</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Добавить пользователя</h2>

        <!-- Форма привязана к объекту user -->
        <form th:action="@{/users}" method="post" th:object="${user}">
            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя:</label>
                <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="Введите имя" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="Введите email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль:</label>
                <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Введите пароль" required>
            </div>
            <div class="mb-3">
                <label for="bio" class="form-label">Биография:</label>
                <textarea th:field="*{bio}" id="bio" class="form-control" rows="3" placeholder="Расскажите о себе"></textarea>
            </div>
            <div class="mb-3">
                <label for="imageUrl" class="form-label">Фото профиля (URL):</label>
                <input type="text" th:field="*{imageUrl}" id="imageUrl" class="form-control" placeholder="Введите ссылку на фото">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Сохранить</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/users}" class="btn btn-outline-secondary">Назад к списку пользователей</a>
        </div>
    </div>
</div>

<!-- Подключаем JavaScript для Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
